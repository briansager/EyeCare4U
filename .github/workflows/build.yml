name: Windows release candidate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore, build, test, audit, then package win-x64
        shell: pwsh
        run: ./scripts/Package-Portable.ps1
      - name: Upload owner-review ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: EyeCare4U-0.6.0-rc.1-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
